name: Windows upgrade smoke test

on:
  workflow_dispatch:

permissions:
  # Access to the private draft candidate requires push-level contents access.
  contents: write

jobs:
  upgrade:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Download and verify releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($version in @('0.1.0', '0.1.1')) {
            $dir = Join-Path $env:RUNNER_TEMP "superftp-$version"
            New-Item -ItemType Directory -Path $dir | Out-Null
            gh release download "v$version" --repo "${{ github.repository }}" --dir $dir
            if ($LASTEXITCODE -ne 0) { throw "Release $version download failed" }
            $parts = (Get-Content -LiteralPath (Join-Path $dir 'SHA256SUMS.txt')) -split '  ', 2
            $expectedName = "Super.FTP_${version}_x64-setup.exe"
            if ($parts.Count -ne 2 -or $parts[1] -ne $expectedName) { throw "Unexpected checksum file for $version" }
            if ((Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $dir $expectedName)).Hash -ne $parts[0]) { throw "Checksum mismatch for $version" }
          }
      - name: Install old version, upgrade, launch and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $install = Join-Path $env:RUNNER_TEMP 'superftp-upgrade-test'
          $binary = Join-Path $install 'super-ftp.exe'
          $uninstaller = Join-Path $install 'uninstall.exe'
          $registration = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Super FTP'
          if (Test-Path $registration) { throw 'Unexpected pre-existing installation' }
          foreach ($version in @('0.1.0', '0.1.1')) {
            $installer = Join-Path $env:RUNNER_TEMP "superftp-$version\Super.FTP_${version}_x64-setup.exe"
            $process = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$install") -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Installer $version failed: $($process.ExitCode)" }
            if (-not (Test-Path $binary) -or -not (Test-Path $uninstaller)) { throw "Installed files missing for $version" }
            $registered = (Get-ItemProperty -LiteralPath $registration).DisplayVersion
            if ($registered -ne $version) { throw "Expected version $version, got $registered" }
            $app = Start-Process -FilePath $binary -PassThru
            Start-Sleep -Seconds 10
            $app.Refresh()
            if ($app.HasExited) { throw "Application $version exited early: $($app.ExitCode)" }
            $app.CloseMainWindow() | Out-Null
            if (-not $app.WaitForExit(10000)) { Stop-Process -Id $app.Id -Force; throw "Application $version did not close cleanly" }
            if ($version -eq '0.1.1') {
              $env:SUPERFTP_SMOKE_EXECUTABLE = $binary
              node scripts/native-smoke.mjs
              if ($LASTEXITCODE -ne 0) { throw 'Installed application smoke test failed' }
            }
          }
          $process = Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Uninstaller failed: $($process.ExitCode)" }
          if ((Test-Path $binary) -or (Test-Path $registration)) { throw 'Application or registration remains after uninstall' }
