name: Check desktop

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf openssh-server
      - run: npm ci
      - run: npm run verify
      - name: Verify Windows frontend license notices
        if: runner.os == 'Windows'
        env:
          TAURI_ENV_PLATFORM: windows
        run: node scripts/verify-frontend-notices.mjs
      - name: Verify Windows Rust license and NOTICE files
        if: runner.os == 'Windows'
        run: node scripts/verify-rust-notices.mjs
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked
      - name: Real OpenSSH server interoperability
        if: runner.os == 'Linux'
        run: node scripts/openssh-smoke.mjs
      - name: Windows credential store and OpenSSH agent integration
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --lib --locked storage::tests::windows_credential_store_round_trip -- --ignored --exact
          if ($LASTEXITCODE -ne 0) { throw 'Windows credential store integration failed' }
          # This is a disposable GitHub-hosted runner, not a developer machine.
          Set-Service -Name ssh-agent -StartupType Manual
          Start-Service ssh-agent
          cargo test --manifest-path src-tauri/Cargo.toml --lib --locked integration_tests::windows_openssh_agent_authenticates_with_only_the_temporary_fixture_key -- --ignored --exact
          if ($LASTEXITCODE -ne 0) { throw 'Windows OpenSSH agent integration failed' }
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - run: npm run tauri -- build --no-bundle

  ui:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
