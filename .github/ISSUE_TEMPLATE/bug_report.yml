name: Bug report
description: Report a reproducible problem (not a security vulnerability).
labels: []
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private keys, real server details or personal files. Report security vulnerabilities privately as described in SECURITY.md.
  - type: textarea
    id: description
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: Describe the steps and expected result without private information.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version and operating system
      placeholder: Version, OS version and architecture
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Logs or screenshots
      description: Remove sensitive information before sharing.
